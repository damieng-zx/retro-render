<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <title>Screen Renders</title>
    <link
      href="https://fonts.googleapis.com/css?family=Fira+Sans+Condensed:400,700"
      rel="stylesheet"
    />
    <link
      href="main.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <header>
      <div id="logo">
        <h1>Retro Renders</h1>
        <p id="strapline">Canvas rendering of retro file formats.</p>
      </div>
      <fieldset>
        <legend>Direct</legend>
        <label
          >URL
          <input
            type="text"
            id="url"
            value="/samples/newteks.spu"
          />
        </label>
        <button id="renderUrl">Render</button>
      </fieldset>
      <fieldset>
        <legend>Debug</legend>
        <button id="renderSamples">Render Samples</button>
      </fieldset>
      <fieldset>
        <legend>Filtered</legend>
        <label
          >Text
          <input
            type="search"
            id="filter"
            placeholder="dizzy"
          />
        </label>
      </fieldset>
      <fieldset>
        <legend>Results</legend>
        <span id="matchCount">0</span> fuzzy matches, showing top <span id="displayCount"></span>.
      </fieldset>
    </header>
    <content id="output"> </content>
  </body>

  <script src="../lib/system.js"></script>
  <script src="../dist/combined.js"></script>
  <script>
    var byId = (id) => document.getElementById(id);
    var matchCount = byId('matchCount');
    var displayCount = byId('displayCount');
    var output = byId('output');
    var maxCount = 100;
    var threshold = 0.3;
    var samples = [
        '10burg.neo',
        '16crown.neo',
        '3cast.neo',
        '5auswahl.neo',
        '7castle.neo',
        'ChainReaction.scr',
        'dizzy.scr',
        'elmrsesn.neo',
        'magicmtn.neo',
        'newteks.spu',
        'apple.spu'
    ];

    SystemJS.import('index').then(r => {
        var indexUrl = 'https://bitsparse.com/sinclair/screens/loading/';
        var filterInput = byId('filter');
        var outputContent = byId('output');
        var screenList = [];
        var loadTimer;
        var requestId = 0;

        filterInput.oninput = () => triggerRenderFiltered();
        byId('renderUrl').onclick = () => addToOutput(byId('url').value);
        byId('renderSamples').onclick = () => renderSamples();
        loadIndex();

        async function renderSamples() {
            outputContent.innerText = '';
            for (var sample of samples)
                await addToOutput('/samples/' + sample);
        }

        function triggerRenderFiltered() {
            if (loadTimer) {
                window.clearTimeout(loadTimer);
                loadTimer = null;
            }
            loadTimer = window.setTimeout(() => renderFiltered(), 700);
        }

        async function renderFiltered() {
            requestId++;
            var thisRequestId = requestId;
            var filterText = filterInput.value;

            var results = [];
            for (var item of screenList) {
                item.score = item.title.score(filterText);
                if (item.score > threshold)
                    results.push(item);
            }

            results.sort((a, b) => b.score - a.score);

            outputContent.innerText = '';
            matchCount.innerText = results.length;

            var count = 0;
            for (var result of results) {
                if (count >= maxCount) break;
                if (requestId !== thisRequestId) return;

                var canvas = await add(result.url);
                if (requestId !== thisRequestId) return;
                if (!canvas) continue;

                canvas.title = result.title + ' score ' + result.score.toFixed(2);
                output.appendChild(canvas);
                count++;
            }

            if (requestId === thisRequestId)
                displayCount.innerText = count;
        }

        async function addToOutput(url) {
            var canvas = await add(url);
            if (canvas)
                output.appendChild(canvas);
        }

        async function add(url) {
            var canvas = document.createElement('canvas');
            canvas.classList.add('screenshot');
            var rendered = await render(url, canvas);
            return rendered ? canvas : null;
        }

        async function render(url, canvas) {
            try {
                const binary = await getBinary(url);
                const renderer = r.getRenderer(binary);
                const imgDef = renderer.GetImageDefinition(binary);
                if (!imgDef)
                    throw new Error('Unrecognised image definition');

                canvas.width = imgDef.width;
                canvas.height = imgDef.height;

                const context = canvas.getContext('2d');
                const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
                renderer.RenderToImageData(binary, imageData);
                context.putImageData(imageData, 0, 0);
                return true;
            } catch (exception) {
                console.error(`Unable to render ${url}`, exception);
                return false;
            }
        }

        function loadIndex() {
            r.getAsTextLines(indexUrl + '_list.txt')
                .then(text => {
                    screenList = toItems(text, indexUrl);
                })
                .catch(error => {
                    console.warn('Unable to load the remote screen index, falling back to the bundled samples.', error);
                    screenList = toItems(samples, '/samples/');
                })
                .then(() => {
                    if (filterInput.value)
                        renderFiltered();
                });
        }

        function toItems(filenames, baseUrl) {
            return filenames.map(filename => ({
                filename: filename,
                url: baseUrl + filename,
                title: filename.slice(0, -4).replace(/([^A-Z0-9][A-Z])/g, ' $1').trim(),
                score: 0
            }));
        }
    });
  </script>
</html>
